name: netza_mobile
description: "NETZA Kenya mobile shopping app."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  go_router: ^17.5.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  cached_network_image: ^3.4.1
  google_fonts: ^8.2.1
  share_plus: ^11.0.0
  image_picker: ^1.1.2
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0B1F3A"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
